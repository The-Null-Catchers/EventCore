services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: eventcore
      POSTGRES_USER: eventcore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - metadata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U eventcore -d eventcore]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://eventcore:${POSTGRES_PASSWORD}@postgres:5432/eventcore?sslmode=disable
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-owner@example.com}
      BOOTSTRAP_WORKSPACE: ${BOOTSTRAP_WORKSPACE:-demo}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?Set BOOTSTRAP_PASSWORD}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:?Set WEBHOOK_ENCRYPTION_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      BROKER_MIN_FREE_BYTES: ${BROKER_MIN_FREE_BYTES:-67108864}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - logs:/var/lib/eventcore
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    restart: unless-stopped
volumes:
  metadata:
  logs:
